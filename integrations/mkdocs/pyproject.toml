[project]
name = "mkdocs-forge"
version = "0.1.0"
description = "MkDocs plugin for Forge architecture diagrams"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["mkdocs>=1.4"]

[project.entry-points."mkdocs.plugins"]
forge = "mkdocs_forge.plugin:ForgePlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
