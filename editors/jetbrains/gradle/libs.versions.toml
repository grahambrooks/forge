[versions]
kotlin = "2.2.21"
intellijPlatform = "2.19.0"
junit = "6.1.3"
junit4 = "4.13.2"

[libraries]
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
# The IntelliJ test fixtures are JUnit3-era (BasePlatformTestCase extends TestCase), so the
# vintage engine runs them alongside the JUnit 5 tests.
junit-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine" }
# Runtime only: the IntelliJ Platform jars on the test classpath register a JUnit Platform
# session listener that is compiled against JUnit 4. Nothing here is written against JUnit 4.
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
intellijPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intellijPlatform" }
