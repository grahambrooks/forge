pluginGroup = com.grahambrooks.forge
pluginName = Forge Preview
pluginRepositoryUrl = https://github.com/grahambrooks/forge

# CalVer, tracking the forge CLI release it was built alongside.
pluginVersion = 2026.9.7

# 252 == 2025.2, the oldest release this is built and verified against.
pluginSinceBuild = 252

platformVersion = 2025.2.6

javaVersion = 21

# Use the Kotlin stdlib bundled with the IntelliJ Platform rather than shipping our own.
kotlin.stdlib.default.dependency = false

org.gradle.caching = true
org.gradle.parallel = true
org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=768m
