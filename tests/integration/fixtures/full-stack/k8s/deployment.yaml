apiVersion: apps/v1
kind: Deployment
metadata:
  name: fullstack-api
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fullstack-api
  template:
    spec:
      containers:
        - name: api
          image: myregistry/fullstack-api:latest
          ports:
            - containerPort: 8080
