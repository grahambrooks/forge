version: "3.8"
services:
  api:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - db
      - cache
    environment:
      DATABASE_URL: postgres://db:5432/app

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: app

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
