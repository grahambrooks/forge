name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc97ebc # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: forge
      - name: Run tests
        working-directory: forge
        run: cargo test --all

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc97ebc # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: forge
      - name: Check formatting
        working-directory: forge
        run: cargo fmt -- --check
      - name: Clippy
        working-directory: forge
        run: cargo clippy -- -D warnings

  build-example:
    name: Build Example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc97ebc # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: forge
      - name: Build forge
        working-directory: forge
        run: cargo build --release
      - name: Build payments example
        working-directory: forge
        run: |
          ./target/release/forge build -s examples/payments.forge -o /tmp/forge-ci
          ./target/release/forge check -s examples/payments.forge --severity info
          ./target/release/forge generate -s examples/payments.forge -o /tmp/forge-site
          ./target/release/forge export -s examples/payments.forge -f json > /tmp/forge-ci/model.json
          echo "Built $(ls /tmp/forge-ci/*.svg | wc -l) SVGs"
          echo "Generated $(find /tmp/forge-site -name '*.html' | wc -l) HTML pages"
