name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow a single concurrent deployment; let in-progress deploys finish so we
# don't publish an interrupted/partial build.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FORGE_BIN: ${{ github.workspace }}/forge/target/release/forge

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: forge

      - name: Install Python deps
        run: python3 -m pip install --user markdown==3.7

      - name: Build forge (release)
        working-directory: forge
        run: cargo build --release

      - name: Prepare site root
        run: |
          mkdir -p _site
          # Tell GitHub Pages not to run Jekyll on our output.
          touch _site/.nojekyll

      - name: Generate reference-model demo site
        run: |
          "$FORGE_BIN" generate \
            --source forge/examples/payments.forge \
            --out _site/demo \
            --title "Forge — Payments reference model"

      - name: Run evaluation framework (tier 1)
        # Tier 1 clones 5 small open-source projects and runs analyze +
        # site generation against them. Typically finishes in under 3
        # minutes. Tier 2+ clones heavier projects; keep them out of the
        # Pages build to preserve snappy deploys.
        run: python3 eval/run.py --tier 1 --forge "$FORGE_BIN"

      - name: Copy evaluation site
        run: |
          mkdir -p _site/eval
          cp -R eval/results/site/. _site/eval/

      - name: Build docs landing + rendered markdown pages
        run: python3 .github/scripts/build_docs.py _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
