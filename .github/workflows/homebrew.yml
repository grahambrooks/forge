name: Update Homebrew Formula

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-formula:
    name: Update Formula
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - name: Download release checksums
        run: |
          gh release download "${RELEASE_TAG}" --pattern checksums.txt
          cat checksums.txt

      - name: Resolve asset IDs and update formula
        run: |
          VERSION="${RELEASE_TAG#v}"

          SHA_MACOS_ARM=$(grep 'forge-macos-aarch64' checksums.txt | awk '{print $1}')
          SHA_MACOS_X86=$(grep 'forge-macos-x86_64' checksums.txt | awk '{print $1}')
          SHA_LINUX_ARM=$(grep 'forge-linux-aarch64' checksums.txt | awk '{print $1}')
          SHA_LINUX_X86=$(grep 'forge-linux-x86_64' checksums.txt | awk '{print $1}')

          # Get asset IDs for private repo API download URLs
          ASSETS=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets[] | "\(.name) \(.id)"')
          ID_MACOS_ARM=$(echo "$ASSETS" | grep 'forge-macos-aarch64' | awk '{print $2}')
          ID_MACOS_X86=$(echo "$ASSETS" | grep 'forge-macos-x86_64' | awk '{print $2}')
          ID_LINUX_ARM=$(echo "$ASSETS" | grep 'forge-linux-aarch64' | awk '{print $2}')
          ID_LINUX_X86=$(echo "$ASSETS" | grep 'forge-linux-x86_64' | awk '{print $2}')

          cat > Formula/forge.rb << FORMULA
          class Forge < Formula
            desc "Unified software modeling DSL — architecture diagrams, docs, and lint from code"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ID_MACOS_ARM}",
                    headers: ["Authorization: token #{ENV.fetch("HOMEBREW_GITHUB_API_TOKEN")}", "Accept: application/octet-stream"]
                sha256 "${SHA_MACOS_ARM}"
              else
                url "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ID_MACOS_X86}",
                    headers: ["Authorization: token #{ENV.fetch("HOMEBREW_GITHUB_API_TOKEN")}", "Accept: application/octet-stream"]
                sha256 "${SHA_MACOS_X86}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ID_LINUX_ARM}",
                    headers: ["Authorization: token #{ENV.fetch("HOMEBREW_GITHUB_API_TOKEN")}", "Accept: application/octet-stream"]
                sha256 "${SHA_LINUX_ARM}"
              else
                url "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ID_LINUX_X86}",
                    headers: ["Authorization: token #{ENV.fetch("HOMEBREW_GITHUB_API_TOKEN")}", "Accept: application/octet-stream"]
                sha256 "${SHA_LINUX_X86}"
              end
            end

            def install
              binary = Dir["*"].first
              bin.install binary => "forge"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/forge --version")
            end
          end
          FORMULA

          sed -i 's/^          //' Formula/forge.rb

      - name: Commit updated formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/forge.rb
          git diff --cached --quiet || git commit -m "Update Homebrew formula for ${RELEASE_TAG}"
          git push
