name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: forge-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact: forge-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: forge-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: forge-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: forge-windows-x86_64.exe

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [[ "${{ matrix.target }}" == "aarch64"* ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi
          # tree-sitter (pulled in via symgraph) compiles a C runtime with
          # the host gcc, which defaults to `-D_FORTIFY_SOURCE=2` on modern
          # Ubuntu. That emits glibc-only `__fprintf_chk` / `__snprintf_chk`
          # / `__vsnprintf_chk` stubs that musl libc doesn't provide, so
          # the final static link fails. Disable FORTIFY for both musl
          # targets so the C code uses the plain libc functions that musl
          # does expose.
          echo "CFLAGS_x86_64_unknown_linux_musl=-U_FORTIFY_SOURCE" >> "$GITHUB_ENV"
          echo "CFLAGS_aarch64_unknown_linux_musl=-U_FORTIFY_SOURCE" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: forge
          key: ${{ matrix.target }}

      - name: Build
        working-directory: forge
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: cp "forge/target/${{ matrix.target }}/release/forge" "${{ matrix.artifact }}"

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: cp "forge/target/${{ matrix.target }}/release/forge.exe" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Collect binaries and generate checksums
        run: |
          mkdir release
          find artifacts -type f -exec mv {} release/ \;
          cd release && sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: release/*
          generate_release_notes: true
