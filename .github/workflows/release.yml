# Release workflow for forge.
#
# forge is a workspace-less repo whose crate lives in the `forge/` subdirectory
# (package `forge-dsl`, binary `forge`), so this is a variant of the standard
# release-kit workflow: it builds with `working-directory: forge` and reads the
# version from forge/Cargo.toml. Everything else — CalVer tag, standard tarball
# names, sha256, and the shared render-formula.py → in-repo Formula/forge.rb — is
# identical to every other grahambrooks project.
#
# Publishing to crates.io needs a CARGO_REGISTRY_TOKEN repo secret (crates.io →
# Account Settings → API Tokens, scoped publish-update for forge-dsl).
name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches forge/Cargo.toml
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          crate=$(awk -F'"' '/^version = / { print $2; exit }' forge/Cargo.toml)
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match forge/Cargo.toml version $crate"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches forge/Cargo.toml version $crate"

  create-release:
    name: create github release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: forge
          key: release-${{ matrix.target }}
      - name: Build
        working-directory: forge
        run: cargo build --release --target ${{ matrix.target }} --bin forge
      - name: Package + upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          asset="forge-${tag}-${{ matrix.target }}.tar.gz"
          tar -C "forge/target/${{ matrix.target }}/release" -czf "$asset" forge
          # no sha256 here — macOS runners lack `sha256sum`, and update-formula
          # recomputes the hash from the published tarball anyway.
          gh release upload "$tag" "$asset" --clobber

  publish-crate:
    name: publish to crates.io
    # Runs last, and only once the binaries are built: a crates.io publish
    # cannot be undone (only yanked), so nothing irreversible happens until
    # the rest of the release has succeeded.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: forge
          key: publish
      - name: Require registry token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set — cannot publish forge-dsl"
            exit 1
          fi
      - name: Skip if this version is already published
        id: published
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # crates.io rejects requests without a descriptive User-Agent.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                 -A "forge-release (github-actions; +https://github.com/${GITHUB_REPOSITORY})" \
                 "https://crates.io/api/v1/crates/forge-dsl/${version}")
          if [ "$code" = "200" ]; then
            echo "forge-dsl ${version} is already on crates.io — skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "404" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::unexpected status ${code} from crates.io when checking forge-dsl ${version}"
            exit 1
          fi
      - name: cargo publish
        if: steps.published.outputs.skip == 'false'
        working-directory: forge
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  update-formula:
    name: update homebrew formula
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Load release config
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .release.env >> "$GITHUB_ENV"
      - name: Render formula
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          mkdir -p Formula
          sleep 10

          empty_sha=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          fetch() {
            local target="$1"
            local url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/forge-${tag}-${target}.tar.gz"
            local sha
            sha=$(curl -sL "$url" | sha256sum | awk '{print $1}')
            if [ -z "$sha" ] || [ "$sha" = "$empty_sha" ]; then
              echo "::error::could not fetch $url" >&2
              exit 1
            fi
            echo "$sha"
          }

          sha_darwin_arm=$(fetch aarch64-apple-darwin)
          sha_linux_arm=$(fetch aarch64-unknown-linux-gnu)
          sha_linux_intel=$(fetch x86_64-unknown-linux-gnu)

          python3 scripts/render-formula.py \
            "$version" "$sha_darwin_arm" "$sha_linux_arm" "$sha_linux_intel" \
            > Formula/forge.rb
      # The `automation-guard` ruleset requires every change to main to arrive
      # via a pull request, and only repository admins bypass it — GITHUB_TOKEN
      # does not, so a direct `git push origin main` is rejected with GH013.
      # The rule asks for no approvals and no status checks, so opening a PR and
      # merging it satisfies the guard rather than working around it.
      - name: Open and merge formula PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/forge.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged"
            exit 0
          fi

          branch="release/formula-${GITHUB_REF_NAME}"
          title="Update Homebrew formula for ${GITHUB_REF_NAME}"
          git checkout -b "$branch"
          git commit -m "$title"
          # Force, so re-running a release reuses the branch instead of failing.
          git push --force origin "$branch"

          pr=$(gh pr list --head "$branch" --state open --json number -q '.[0].number // empty')
          if [ -z "$pr" ]; then
            pr=$(gh pr create --base main --head "$branch" --title "$title" \
                   --body "Automated formula update for ${GITHUB_REF_NAME}, generated by the release workflow from the published release checksums." \
                 | awk -F/ '{print $NF}')
          fi

          # Another automation may merge it first; only a still-open PR is a failure.
          if ! gh pr merge "$pr" --squash --delete-branch; then
            state=$(gh pr view "$pr" --json state -q .state)
            if [ "$state" != "MERGED" ]; then
              echo "::error::formula PR #${pr} could not be merged (state=${state})"
              exit 1
            fi
          fi
