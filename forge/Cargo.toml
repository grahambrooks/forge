[package]
name = "forge"
version = "0.1.0"
edition = "2021"
description = "A unified software modeling DSL — structure + process diagrams from code"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"
walkdir = "2"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt", "macros", "io-std", "net", "io-util", "time", "sync", "fs"] }
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }
gix = { version = "0.72", default-features = false, features = ["max-performance-safe"] }
serde_json = "1"
