<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120.0 230.0" width="1120.0" height="230.0" class="forge-diagram">
  <rect width="1120.0" height="230.0" fill="#ffffff" />
  <defs>
    <style>
    .forge-diagram {
      font-family: 'Open Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    }
    .forge-title {
      font-size: 20px; font-weight: 600; fill: #333; text-anchor: middle;
    }

    /* ── No drop shadow in outline mode ── */
    .forge-shadow { filter: none; }

    /* ── Element base ── */
    .forge-element text { text-anchor: middle; }
    .forge-label--name { font-size: 14px; font-weight: 600; }
    .forge-label--desc { font-size: 11px; font-weight: 400; opacity: 0.7; }
    .forge-label--tech { font-size: 11px; font-weight: 400; font-style: italic; opacity: 0.6; }
    .forge-label--kind { font-size: 10px; font-weight: 400; opacity: 0.5; }

    /* ── Person (outline) ── */
    .forge-element--person .forge-person-head { fill: none; stroke: #08427B; stroke-width: 2; }
    .forge-element--person .forge-person-body { fill: none; stroke: #08427B; stroke-width: 2; }
    .forge-element--person rect { fill: none; stroke: #08427B; stroke-width: 2; rx: 8; ry: 8; }
    .forge-element--person .forge-label--name { fill: #08427B; }
    .forge-element--person .forge-label--desc { fill: #555; }
    .forge-element--person .forge-label--kind { fill: #888; }

    /* ── Software System (outline) ── */
    .forge-element--system rect { fill: none; stroke: #1168BD; stroke-width: 2; rx: 8; ry: 8; }
    .forge-element--system .forge-label--name { fill: #1168BD; }
    .forge-element--system .forge-label--desc { fill: #555; }
    .forge-element--system .forge-label--tech { fill: #777; }
    .forge-element--system .forge-label--kind { fill: #888; }

    /* ── Container (outline) ── */
    .forge-element--container rect { fill: none; stroke: #438DD5; stroke-width: 2; rx: 8; ry: 8; }
    .forge-element--container .forge-label--name { fill: #438DD5; }
    .forge-element--container .forge-label--desc { fill: #555; }
    .forge-element--container .forge-label--tech { fill: #777; }
    .forge-element--container .forge-label--kind { fill: #888; }

    /* ── Component (outline) ── */
    .forge-element--component rect { fill: none; stroke: #6BA3D6; stroke-width: 2; rx: 8; ry: 8; }
    .forge-element--component .forge-label--name { fill: #6BA3D6; }
    .forge-element--component .forge-label--desc { fill: #555; }
    .forge-element--component .forge-label--tech { fill: #777; }

    /* ── Database cylinder (outline) ── */
    .forge-element--database .forge-label--name { fill: #438DD5; }
    .forge-element--database .forge-label--tech { fill: #777; }
    .forge-element--database .forge-label--kind { fill: #888; }

    /* ── Stage (outline) ── */
    .forge-element--stage rect { fill: none; stroke: #9E9E9E; stroke-width: 2; rx: 6; ry: 6; }
    .forge-element--stage .forge-label--name { fill: #333; }
    .forge-element--stage .forge-label--desc { fill: #757575; }
    .forge-element--stage .forge-label--tech { fill: #757575; }

    /* ── Gate diamond (outline) ── */
    .forge-element--gate polygon { fill: none; stroke: #E65100; stroke-width: 2; }
    .forge-element--gate .forge-label--name { fill: #BF360C; font-size: 9px; }

    /* ── Relationships ── */
    .forge-relationship line { stroke: #707070; stroke-width: 1.5; }
    .forge-relationship path { stroke: #707070; stroke-width: 1.5; fill: none; }
    .forge-relationship--arrow { fill: #707070; }
    .forge-label--rel { font-size: 11px; fill: #555; text-anchor: middle; }
    .forge-label--rel-tech { font-size: 10px; fill: #888; font-style: italic; text-anchor: middle; }

    /* ── Pipeline connectors ── */
    .forge-connector line { stroke: #9E9E9E; stroke-width: 2.5; stroke-dasharray: 8,4; }
    .forge-connector--arrow { fill: #9E9E9E; }

    /* ── Legend ── */
    .forge-legend rect.forge-legend-bg { fill: #fff; stroke: #ccc; stroke-width: 1; rx: 4; ry: 4; }
    .forge-legend text { font-size: 10px; fill: #555; }
    .forge-legend .forge-legend-title { font-size: 11px; font-weight: 600; fill: #333; }
    .forge-legend rect.forge-legend-swatch { stroke-width: 2; rx: 2; ry: 2; }
    </style>
    <filter id="dropShadow" x="-4%" y="-4%" width="110%" height="114%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#707070"/></marker>
    <marker id="arrow-pipe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#9E9E9E"/></marker>
  </defs>
  <text x="560" y="30" class="forge-title">Payment API — CI/CD Pipeline</text>
  <g class="forge-relationships">
    <g class="forge-connector" data-from="payments-ci.build" data-to="payments-ci.security">
      <line x1="230.0" y1="120.0" x2="310.0" y2="120.0" marker-end="url(#arrow-pipe)" />
    </g>
    <g class="forge-connector" data-from="payments-ci.security" data-to="payments-ci.staging">
      <line x1="480.0" y1="120.0" x2="560.0" y2="120.0" marker-end="url(#arrow-pipe)" />
    </g>
    <g class="forge-connector" data-from="payments-ci.staging" data-to="payments-ci.prod">
      <line x1="730.0" y1="120.0" x2="810.0" y2="120.0" marker-end="url(#arrow-pipe)" />
    </g>
  </g>
  <g class="forge-elements">
    <g class="forge-element forge-element--stage" data-id="payments-ci.build">
      <rect x="60" y="80" width="170" height="80" class="forge-shadow" />
      <text x="145" y="126" class="forge-label--name">Build &amp; Test</text>
    </g>
    <g class="forge-element forge-element--stage" data-id="payments-ci.security">
      <rect x="310" y="80" width="170" height="80" class="forge-shadow" />
      <text x="395" y="126" class="forge-label--name">Security Scan</text>
    </g>
    <g class="forge-element forge-element--gate" data-id="payments-ci.security.gate">
      <polygon points="520,85 555,120 520,155 485,120" />
      <text x="520" y="116" class="forge-label--name" dominant-baseline="central">no</text>
      <text x="520" y="130" class="forge-label--name" dominant-baseline="central">critical-vulns</text>
    </g>
    <g class="forge-element forge-element--stage" data-id="payments-ci.staging">
      <rect x="560" y="80" width="170" height="80" class="forge-shadow" />
      <text x="645" y="118" class="forge-label--name">Deploy Staging</text>
      <text x="645" y="134" class="forge-label--tech">[staging]</text>
    </g>
    <g class="forge-element forge-element--gate" data-id="payments-ci.staging.gate">
      <polygon points="770,85 805,120 770,155 735,120" />
      <text x="770" y="116" class="forge-label--name" dominant-baseline="central">integration</text>
      <text x="770" y="130" class="forge-label--name" dominant-baseline="central">tests-pass</text>
    </g>
    <g class="forge-element forge-element--stage" data-id="payments-ci.prod">
      <rect x="810" y="80" width="170" height="80" class="forge-shadow" />
      <text x="895" y="118" class="forge-label--name">Deploy Production</text>
      <text x="895" y="134" class="forge-label--tech">[production]</text>
    </g>
    <g class="forge-element forge-element--gate" data-id="payments-ci.prod.gate">
      <polygon points="1020,85 1055,120 1020,155 985,120" />
      <text x="1020" y="116" class="forge-label--name" dominant-baseline="central">manual</text>
      <text x="1020" y="130" class="forge-label--name" dominant-baseline="central">approval</text>
    </g>
  </g>
  <g class="forge-legend">
    <rect class="forge-legend-bg" x="940" y="144" width="160" height="76" />
    <text x="950" y="164" class="forge-legend-title">Legend</text>
    <rect class="forge-legend-swatch" x="950" y="172" width="14" height="14" fill="none" stroke="#F5F5F5" />
    <text x="972" y="183">Stage</text>
    <rect class="forge-legend-swatch" x="950" y="192" width="14" height="14" fill="none" stroke="#FFF3E0" />
    <text x="972" y="203">Gate</text>
  </g>
</svg>
