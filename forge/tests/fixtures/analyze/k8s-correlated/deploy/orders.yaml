apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-config
  namespace: prod
data:
  LOG_LEVEL: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: prod
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: orders
          image: orders:latest
          env:
            - name: DATABASE_URL
              value: "postgres://db.prod.svc.cluster.local:5432/orders"
            - name: REDIS_URL
              value: "redis://cache.prod.svc.cluster.local:6379"
